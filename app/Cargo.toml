[package]
name = "knipsdruck"
description = "Fotos von Dokumenten druckfertig machen"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
kd-core.workspace = true
kd-pdf.workspace = true
kd-print.workspace = true
kd-phone.workspace = true
kd-ocr.workspace = true
log.workspace = true
env_logger.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
image.workspace = true
rayon.workspace = true
eframe = { version = "0.36", features = ["glow"] }
rfd = "0.17"
