<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- SPDX-License-Identifier: MIT OR Apache-2.0 -->
  <!-- Knipsdruck-Icon (eigene Gestaltung): hinten das schief fotografierte Blatt mit den vier Eckpunkten der
       Erkennung, davor das gerade gerückte, druckfertige Blatt. macOS-Squircle mit 100 px Rand nach Apples Raster.
       Rendern: scripts/make-icon.sh -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f6fe8"/>
      <stop offset="1" stop-color="#1748b4"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef2f9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0a1f55" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="none" stroke="#fff" stroke-opacity="0.10" stroke-width="4"/>

  <!-- Foto: schräg aufgenommenes Blatt, gestrichelt, mit Eckpunkten -->
  <path d="M262 246 L664 214 L804 768 L216 806 Z" fill="#fff" fill-opacity="0.07"
        stroke="#fff" stroke-opacity="0.6" stroke-width="12" stroke-linejoin="round" stroke-dasharray="26 22"/>
  <g fill="#fff">
    <circle cx="262" cy="246" r="28"/>
    <circle cx="664" cy="214" r="28"/>
    <circle cx="804" cy="768" r="28"/>
    <circle cx="216" cy="806" r="28"/>
  </g>
  <g fill="#1f5bd6">
    <circle cx="262" cy="246" r="11"/>
    <circle cx="664" cy="214" r="11"/>
    <circle cx="804" cy="768" r="11"/>
    <circle cx="216" cy="806" r="11"/>
  </g>

  <!-- Ergebnis: gerades Blatt mit Eselsohr und Textzeilen -->
  <g filter="url(#shadow)">
    <path d="M336 282 H600 L688 370 V742 Q688 762 668 762 H356 Q336 762 336 742 V302 Q336 282 356 282 Z" fill="url(#paper)"/>
    <path d="M600 282 V350 Q600 370 620 370 H688 Z" fill="#c9d4e8"/>
  </g>
  <g fill="#1f5bd6">
    <rect x="384" y="336" width="150" height="30" rx="10"/>
  </g>
  <g fill="#b8c4d9">
    <rect x="384" y="420" width="256" height="18" rx="9"/>
    <rect x="384" y="464" width="256" height="18" rx="9"/>
    <rect x="384" y="508" width="200" height="18" rx="9"/>
    <rect x="384" y="574" width="256" height="18" rx="9"/>
    <rect x="384" y="618" width="230" height="18" rx="9"/>
    <rect x="384" y="662" width="150" height="18" rx="9"/>
  </g>
</svg>
